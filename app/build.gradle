plugins {
    id 'com.android.application'
}

android {
    namespace 'com.radar.freebie'
    compileSdk 35

    defaultConfig {
        applicationId "com.radar.freebie"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        // 只要 64 位 arm64-v8a（安卓 12-17 主流机型）
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，方便直接侧载安装
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 无第三方依赖，纯 Android 原生 API
}