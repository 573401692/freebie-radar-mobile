name: 编译安卓 APK

on:
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 查看产出
        run: |
          echo "=== APK 文件 ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: 重命名 APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/FreebieRadar-arm64-v8a.apk
          ls -lh release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FreebieRadar-apk
          path: release/FreebieRadar-arm64-v8a.apk

      - name: 发布到 Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: 资源雷达 v1.0.0 (build ${{ github.run_number }})
          body: |
            资源雷达安卓客户端（64位 arm64-v8a）

            - 适配安卓 12-17
            - 自动每 2 小时拉取最新福利数据
            - 发现新福利时推送通知
          files: release/FreebieRadar-arm64-v8a.apk
          draft: false
          prerelease: false